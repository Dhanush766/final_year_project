<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security check failed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container text-center py-5">
    <div class="display-1 fw-bold text-danger">403</div>
    <h1 class="h3 mb-3">Security check failed</h1>
    <p class="text-muted">
      Your form session has expired or the request could not be verified (CSRF protection).
      Please go back, refresh the page and submit the form again.
    </p>
    <a href="/" class="btn btn-primary">Go to home page</a>
  </div>
</body>
</html>
